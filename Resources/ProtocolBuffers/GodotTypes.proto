syntax = "proto3";

option csharp_namespace = "Resources.ProtocolBuffers";

message GDPVector2 {
  float x = 1;
  float y = 2;
}

message GDPVector2I {
  int32 x = 1;
  int32 y = 2;
}

message GDPRect2 {
  GDPVector2 end = 1;
  GDPVector2 position = 2;
  GDPVector2 size = 3;
}

message Rect2I {
  GDPVector2I end = 1;
  GDPVector2I position = 2;
  GDPVector2I size = 3;
}

message GDPVector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message GDPVector3I {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;
}

message GDPVector4 {
  float w = 1;
  float x = 2;
  float y = 3;
  float z = 4;
}

message GDPVector4I {
  int32 w = 1;
  int32 x = 2;
  int32 y = 3;
  int32 z = 4;
}

message GDPPlane {
  float d = 1;
  GDPVector3 normal = 2;
  float x = 3;
  float y = 4;
  float z = 5;
}

message AABB {
  GDPVector3 end = 1;
  GDPVector3 position = 2;
  GDPVector3 size = 3;
}