syntax = "proto3";

option csharp_namespace = "Resources.ProtocolBuffers.Godot";

message GdVector2 {
  float x = 1;
  float y = 2;
}

message GdVector2I {
  int32 x = 1;
  int32 y = 2;
}

message GdRect2 {
  GdVector2 end = 1;
  GdVector2 position = 2;
  GdVector2 size = 3;
}

message GdRect2I {
  GdVector2I end = 1;
  GdVector2I position = 2;
  GdVector2I size = 3;
}

message GdVector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message GdVector3I {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;
}

message GdVector4 {
  float w = 1;
  float x = 2;
  float y = 3;
  float z = 4;
}

message GdVector4I {
  int32 w = 1;
  int32 x = 2;
  int32 y = 3;
  int32 z = 4;
}

message GdPlane {
  float d = 1;
  GdVector3 normal = 2;
  float x = 3;
  float y = 4;
  float z = 5;
}

message GdAABB {
  GdVector3 end = 1;
  GdVector3 position = 2;
  GdVector3 size = 3;
}