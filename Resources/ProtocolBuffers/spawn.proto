syntax = "proto3";
option csharp_namespace = "Resources.ProtocolBuffers";

service Spawner {
  rpc SpawnStream (stream SpawnInfoRequest) returns (stream SpawnInfoReply);
}

// Client requesting spawn info
message SpawnInfoRequest {
  int32 node_network_id = 1;
}

// Server telling client to spawn a node and what its' network id should be 
message SpawnInfoReply {
  int32 node_network_id = 1;
  string node_name = 2;
}